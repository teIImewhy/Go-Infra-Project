<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ultimate-adams | Infrastructure</title>
    <style>
        :root {
            --bg-color: #090a0f;
            --card-bg: rgba(22, 27, 34, 0.4);
            --text-color: #adbac7;
            --accent-color: #539bf5;
            --border-color: rgba(68, 76, 86, 0.5);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
            position: relative;
        }

        /* Красивые размытые светящиеся круги на фоне */
        body::before, body::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            z-index: 1;
            opacity: 0.15;
        }
        body::before {
            width: 400px;
            height: 400px;
            background: #539bf5;
            top: -100px;
            left: -100px;
        }
        body::after {
            width: 300px;
            height: 300px;
            background: #9646fd;
            bottom: -50px;
            right: -50px;
        }

        .profile-container {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 40px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            z-index: 2;
        }

        .nickname {
            font-size: 2rem;
            font-weight: 700;
            color: #fff;
            margin: 0 0 8px 0;
            letter-spacing: -0.5px;
        }

        .server-ip {
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
            background: rgba(144, 157, 171, 0.12);
            color: #768390;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            display: inline-block;
            margin-bottom: 30px;
            border: 1px solid rgba(205, 217, 229, 0.06);
        }

        .links-stack {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-link {
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(205, 217, 229, 0.05);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 14px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn-link:hover {
            background: var(--accent-color);
            border-color: var(--accent-color);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(83, 155, 245, 0.3);
        }
    </style>
</head>
<body>

    <div class="profile-container">
        <!-- Никнейм -->
        <div class="nickname">ultimate-adams</div>
        
        <!-- IP сервера со скриншота Nginx -->
        <div class="server-ip">node: 130.49.153.243</div>
        
        <!-- Минималистичные кнопки на сервисы -->
        <div class="links-stack">
            <a href="/grafana/" class="btn-link">Grafana Dashboard</a>
            <a href="/prometheus/" class="btn-link">Prometheus Admin</a>
        </div>
    </div>

</body>
</html>
