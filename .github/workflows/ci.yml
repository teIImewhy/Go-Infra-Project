name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go-app/go.mod
          cache: true
          cache-dependency-path: go-app/go.mod

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: GolangCI Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: go-app
          args: --issues-exit-code=0 ./...

      - name: Build
        working-directory: go-app
        run: go build ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker build
        uses: docker/build-push-action@v7
        with:
          context: ./go-app
          file: ./go-app/Dockerfile
          tags: ghcr.io/teiimewhy/go-app:${{ github.sha }}
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/teiimewhy/go-app:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: 0

      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push ghcr.io/teiimewhy/go-app:${{ github.sha }}
