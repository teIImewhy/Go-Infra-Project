name: CD

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Git commit SHA / Docker image tag to deploy"
        required: true
        type: string

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: vps_production

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            set -e

            REPO_DIR="$HOME/Go-Infra-Project"
            ENV_SOURCE="$HOME/.Go-Infra-Project/.env"
            REPO_URL="git@github.com:teiimewhy/Go-Infra-Project.git"
            IMAGE_TAG="${{ inputs.image_tag }}"

            echo "Deploying version: $IMAGE_TAG"

            if [ ! -f "$ENV_SOURCE" ]; then
            echo "ERROR: $ENV_SOURCE not found"
            exit 1
            fi

            mkdir -p "$REPO_DIR"

            if [ ! -d "$REPO_DIR/.git" ]; then
            cd "$REPO_DIR"
            git init
            git remote add origin "$REPO_URL"
            fi

            cd "$REPO_DIR"
            git fetch origin

            git checkout --detach "$IMAGE_TAG"

            if [ ! -f "$REPO_DIR/.env" ]; then
            echo "Copying .env..."
            cp "$ENV_SOURCE" "$REPO_DIR/.env"
            chmod 600 "$REPO_DIR/.env"
            fi

            IMAGE_TAG="$IMAGE_TAG" docker compose pull
            IMAGE_TAG="$IMAGE_TAG" docker compose up -d

            docker compose ps
